[project]
name = "ronda-server"
version = "0.1.0"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.2",              # Depends(scope="function")
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.54.0",
    "asyncmy>=0.2.18",
    "alembic>=1.20.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "jinja2>=3.1",
    "httpx>=0.28",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.34",
    "tzdata>=2026.6",              # zoneinfo untuk DISPLAY_TIMEZONE; image slim tidak menjamin /usr/share/zoneinfo
    "openpyxl>=3.1",               # ekspor laporan Excel
]

[dependency-groups]
dev = ["pytest>=9.2.0", "pytest-asyncio>=1.5.0", "ruff>=0.17.5"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E9", "F", "B"]   # error sintaks, nama tak terdefinisi/impor tak terpakai, bug umum

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Engine async terikat ke event loop tempat koneksi dibuat: semua test & fixture memakai satu loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
